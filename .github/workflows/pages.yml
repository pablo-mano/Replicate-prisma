name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/screenshot-analysis-mock-u6eAD
  workflow_dispatch:

# Allow this workflow to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement: true turns on GitHub Pages (build type "workflow")
        # for the repo if it isn't already enabled.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        # Publishes the whole repo root; index.html is served at the site root.
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
